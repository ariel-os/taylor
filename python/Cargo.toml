[package]
name = "taylor-suit"
version.workspace = true
edition = "2024"
description = "Python bindings for the taylor SUIT manifest generator"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ariel-os/taylor"
publish = false

[lib]
name = "_taylor"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py39"] }
serde_json = "1.0.149"
taylor = { path = ".." }
