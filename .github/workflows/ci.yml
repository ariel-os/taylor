name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Build docs (own crate only, no dependency docs)
        run: cargo doc --locked --no-deps --verbose
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check the Python bindings crate
        run: cargo check --locked -p taylor-suit

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build and install the Python package
        run: python -m pip install "./python[test]"

      - name: Run Python tests
        run: python -m pytest python/tests

  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails if the public API breaks without a matching Cargo.toml version bump.
      - name: Check semver compatibility
        uses: obi1kenobi/cargo-semver-checks-action@v2
