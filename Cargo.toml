[package]
name = "taylor"
version = "0.1.0"
edition = "2024"
description = "Generates IETF SUIT manifests, CBOR-encoded, from a JSON description"
license = "MIT OR Apache-2.0"
repository = "https://github.com/schnitzm/taylor"
readme = "README.md"
keywords = ["suit", "cbor", "firmware", "manifest", "iot"]
categories = ["encoding", "embedded"]

[dependencies]
ciborium = "0.2.2"
hex = "0.4.3"
serde = "1.0.228"
serde_bytes = "0.11.19"
serde_json = "1.0.149"
sha256 = "1.6.0"


[features]
default = ["std"]
std = []
